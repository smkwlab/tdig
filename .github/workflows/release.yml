# Release workflow for tdig
#
# Triggered on tag push matching X.Y.Z (no `v` prefix, consistent with
# the pre-existing 0.2.0 tag). Builds a Bakeware standalone binary for
# Linux x86_64 and macOS arm64, then attaches them to a GitHub Release.
#
# See Issue #49 for the design discussion and asset naming convention.

name: Release

on:
  push:
    tags:
      # Match numeric semver tags X.Y.Z. GitHub Actions tag filters
      # support `+` as "one or more of the preceding character" (see the
      # cheat sheet at
      # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      # which shows `v[12].[0-9]+.[0-9]+` matching `v1.0.2`). The extglob
      # form `+([0-9])` is NOT supported here and silently fails to
      # match real tags (verified empirically: tag `0.3.0` did not
      # trigger this workflow when the pattern was extglob).
      - '[0-9]+.[0-9]+.[0-9]+'
  # Build both matrix halves without publishing anything, so that a change
  # to this workflow -- or to the OTP/Elixir pair it builds with -- can be
  # exercised before a version is spent on it. Until this existed the only
  # way to run the release path was to push a real tag, and a tag cannot be
  # taken back: tdig #50 shipped a tag filter that matched nothing, and #51
  # had to undo it. The two tag-only steps below are guarded on the ref, so
  # a dispatch run stops after uploading the binaries as workflow artifacts.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: tdig-linux-x86_64
          - os: macos-latest
            asset_name: tdig-macos-arm64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang/Elixir
        # Both rows build with the same pair, so state it here as a literal
        # instead of routing it through `matrix.otp` / `matrix.elixir`.
        # Renovate reads setup-beam's version inputs, but only when they are
        # literals: behind a `${{ }}` reference it sees an expression and
        # raises nothing. That is how this pair sat at OTP 27.3.4.4 while the
        # CI matrix moved on to 27.3.4.17 -- the same blind spot as the
        # workflow_call input defaults in smkwlab/.github#146, which needed a
        # custom manager to reach. Keeping the value where the built-in
        # manager already looks avoids needing one here.
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'

      - name: Cache mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify mix.exs version matches the tag
        # Refuse to release if mix.exs version diverges from the pushed tag,
        # which would leave `tdig --version` lying about the release.
        # A dispatch run has no tag to compare against -- GITHUB_REF_NAME is
        # the branch there -- so this check only applies to tag pushes.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Read first, compare second. Written as one pipeline the exit status
          # belongs to tail, so a mix that could not run at all reports as a
          # version mismatch against an empty string -- a failure with the
          # wrong name on it, pointing at the tag when the tag is fine.
          if ! MIX_OUTPUT=$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])'); then
            echo "::error::could not read the version from mix.exs"
            printf '%s\n' "${MIX_OUTPUT}"
            exit 1
          fi
          MIX_VERSION=$(printf '%s\n' "${MIX_OUTPUT}" | tail -n 1)
          if [ -z "${MIX_VERSION}" ]; then
            echo "::error::mix ran but produced no version"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "${MIX_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::mix.exs version (${MIX_VERSION}) does not match the tag (${TAG_VERSION})"
            exit 1
          fi
          echo "mix.exs version (${MIX_VERSION}) matches tag (${TAG_VERSION})"

      - name: Build Bakeware release
        env:
          MIX_ENV: prod
        run: mix release

      - name: Rename binary for asset upload
        run: |
          cp _build/prod/rel/bakeware/tdig "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"
          ls -lh "${{ matrix.asset_name }}"

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # Never publish from a dispatch run. The point of the dispatch path is to
    # prove the build, so everything from here on -- the GitHub Release, the
    # checksums and the cosign signature -- stays on the tag path.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless cosign signing via GitHub OIDC

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Collect binaries into a flat directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS
        # Publish a checksum manifest so downloads can be verified
        # (curl | chmod | run otherwise trusts the transport blindly).
        # `tdig-*` deliberately excludes the SHA256SUMS file itself.
        run: |
          shopt -s nullglob
          cd release
          bins=(tdig-*)
          # Refuse to publish an unverifiable release if no binaries were
          # collected (fail loudly instead of a bare literal-glob error).
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::no tdig-* binaries found in release/; refusing to publish"
            exit 1
          fi
          sha256sum "${bins[@]}" | tee SHA256SUMS
          # Sanity check the manifest round-trips before publishing.
          sha256sum -c SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless)
        # Keyless signing via GitHub OIDC — no long-lived key. Produces a
        # self-contained bundle (signature + Fulcio cert + Rekor proof) that
        # ties the manifest to THIS release workflow's identity. Signing the
        # manifest covers both binaries transitively (sha256sum -c does the rest).
        run: |
          cd release
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          # Fail the release if the bundle we just produced does not verify.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/[^/]+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "tdig ${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*
